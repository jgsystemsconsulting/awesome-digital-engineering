name: Suggest a resource
description: Suggest a SysML / Magic Grid / Cameo MBSE resource to add to the list
title: "[Suggestion] <resource name>"
labels: ["suggestion"]
body:
  - type: input
    id: name
    attributes:
      label: Resource name
      placeholder: e.g. MagicGrid Book of Knowledge
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: URL
      placeholder: https://...
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: One-line description (≤ 140 characters, factual, no hype)
    validations:
      required: true
  - type: dropdown
    id: section
    attributes:
      label: Which section does it belong in?
      options:
        - Magic Grid & Cameo / CATIA Magic
        - Model Gallery (it's a real, openable model)
        - Broader SysML / MBSE Context
    validations:
      required: true
  - type: checkboxes
    id: bar
    attributes:
      label: Inclusion bar (see CONTRIBUTING.md)
      options:
        - label: On-topic for SysML v1/v2 or MBSE practice
          required: true
        - label: Substantive (teaches/demonstrates/specifies/provides something usable — not pure marketing)
          required: true
        - label: The link is live right now
          required: true
        - label: It isn't already in the list
          required: true
        - label: Publicly accessible (we link, we never re-host)
          required: true
